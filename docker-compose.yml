# Local stack: PostgreSQL + the app. For development only — see docs/DEPLOYMENT.md for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc
      POSTGRES_DB: ttc_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://ttc:ttc@db:5432/ttc_dev
      APP_BASE_URL: http://localhost:3000
      # Session cookies are Secure in production mode; browsers allow that on http://localhost only.
      NODE_ENV: production
    ports: ["3000:3000"]
volumes:
  pgdata:
